<header class="header-section">
  <div class="container header">
    <a class="header__logo-wrapper" href="/">
      <picture>
        <source
          srcset="/img/logo/logo-header-desktop.png"
          media="(width >= 1440px)" />
        <img
          src="/img/logo/logo-header-desktop.png"
          alt="Jolly Match 3"
          width="64"
          height="48"
          class="header__logo" />
      </picture>
    </a>

    <div class="header-dropdown" data-visible="false">
      <nav class="header-nav">
        <ul class="header-nav__list">
          <li><a href="/#about" class="header-nav__link">About the Game</a></li>
          <li><a href="/#features" class="header-nav__link">Features</a></li>
          <li><a href="/#characters" class="header-nav__link">Characters</a></li>
          <li><a href="/#reviews" class="header-nav__link">Reviews</a></li>
          <li><a href="/#faq" class="header-nav__link">FAQ</a></li>
          <li><a href="/#why-download" class="header-nav__link">Why Download</a></li>
        </ul>
      </nav>

      <a
        class="playstore-link header-nav__playstore-link"
        href="https://play.google.com/store/apps/details?id=com.jollyco.jollybattlematch3&hl=en&gl=us"
        target="_blank"
        rel="noopener noreferrer">
        <picture>
          <source
            srcset="/img/googlePlay/header-desktop.png"
            media="(width >= 1440px)" />
          <img
            src="/img/googlePlay/mobile.png"
            alt="Get Jolly Match 3 on Google Play"
            width="180"
            height="53"
            class="playstore-link__image" />
        </picture>
      </a>
    </div>

    <button
      class="header__burger-menu-btn"
      data-action="toggle"
      data-is-menu-open="false">
      <svg width="44" height="44" class="header__burger-menu-icon">
        <use
          href="/img/sprite.svg#icon-burger-menu-closed"
          class="header__burger-menu-icon--closed" />
        <use
          href="/img/sprite.svg#icon-burger-menu-opened"
          class="header__burger-menu-icon--opened" />
      </svg>
    </button>
  </div>
</header>

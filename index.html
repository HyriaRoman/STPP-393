<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/jolly-match-3/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <script type="module" crossorigin src="/jolly-match-3/index.js"></script>
    <link rel="stylesheet" crossorigin href="/jolly-match-3/assets/index-DQHSSVhY.css">

  <body>
    

    <main>
      <section class="hero-section">
  <div class="hero__container">
    <div class="hero__reversedWrapper">
      <h1 class="hero__title">One Match. One Step Closer to Home.</h1>

      <p class="hero__subtitle">Turn every match into a fresh start</p>
    </div>

    <p class="hero__desc">
      Restore a candy world through puzzles, teamwork, and lovable helpers.
    </p>

    <a
      class="hero__google"
      href="https://play.google.com/store/apps/details?id=com.jollyco.jollybattlematch3&hl=en&gl=us"
      target="_blank"
      rel="noopener noreferrer">
      <svg width="32" height="32">
        <use href="/jolly-match-3/assets/sprite-DFCN-yfG.svg#google"></use>
      </svg>

      <p class="hero__btn_text">
        GET IT ON<span class="hero__btn_span">Google Play</span>
      </p>
    </a>
  </div>

  <div class="hero__imgWrapper">
    <img
      class="hero__cloud"
      src="/jolly-match-3/assets/hero-cloud-CBCW3GXk.png"
      alt="cloud"
      width="209"
      height="108"
      loading="lazy" />
    <img
      class="hero__smallCloud"
      src="/jolly-match-3/assets/hero-cloud-CBCW3GXk.png"
      alt="big cloud"
      width="87"
      height="45"
      loading="lazy" />

    <img
      class="hero__img"
      src="/jolly-match-3/assets/hero-mobile-DyPsS-py.png"
      alt="hero"
      width="375"
      height="418"
      loading="lazy" />
  </div>
</section>

    </main>

    

  </body>
